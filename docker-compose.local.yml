services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fulfil
      POSTGRES_PASSWORD: fulfil
      POSTGRES_DB: fulfil
    ports:
      - "5433:5432"
    volumes:
      - fulfil_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfil"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  fulfil_db_data:
