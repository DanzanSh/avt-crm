<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта склада — Fulfil</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/js/core.js"></script>
  <script src="/js/scan-layout.js"></script>
  <style>
    /* .toolbar — общий, вынесен в theme.css. */

    /* 0.3 — сводная полоса чипов над картой: «A · 3 стеллажа · 120 мест · 45 занято»,
       клик прокручивает к секции. Считается на клиенте из cell-map. */
    .zone-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    /* Чип — навигация по секциям, а не подпись: не должен быть мельче кнопок
       тулбара (.btn, 16px). */
    .zone-chip {
      font-family: var(--font); font-size: 16px; color: var(--text);
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 14px; cursor: pointer;
    }
    .zone-chip:hover, .zone-chip:focus-visible { background: var(--row-hover); }

    /* 0.3 — секции идут слева направо и переносятся по ширине, а не стопкой вниз.
       Отдельный класс .map-grid, чтобы не ломать el.className = 'empty-state'
       в состоянии пустоты/ошибки (там #map — просто текст-заглушка). */
    #map.map-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    @media (max-width: 768px) {
      #map.map-grid { flex-direction: column; }
      #map.map-grid .zone-block { width: 100%; }
    }

    /* Карточка секции из макета: синяя заливка, радиус 12, падинг 18. */
    .zone-block {
      background: rgba(53, 96, 189, 0.5);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 20px;
      width: fit-content;
      min-width: 280px;
      max-width: 100%;
      overflow-x: auto; /* если сама секция шире экрана — скролл внутри неё, не у страницы */
    }
    #map.map-grid .zone-block { margin-bottom: 0; }
    .zone-title-row { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; }
    .zone-title { font-family: var(--font-ui); font-weight: 700; font-size: 16px; color: var(--text); margin: 0; }
    /* Разделитель «·» из макета — псевдоэлементом, чтобы не попадать в
       textContent: renameZone() префилит промпт текстом .zone-title. */
    .zone-title-row .link-action::before { content: '·'; margin-right: 6px; color: rgba(24, 34, 51, 0.55); }

    .rack { margin-bottom: 12px; }
    .rack:last-child { margin-bottom: 0; }
    /* Подпись стеллажа — сама точка входа в меню, отдельных иконок нет. */
    .rack-label {
      display: inline-block; font-size: 15px; font-weight: 800; color: var(--text);
      white-space: nowrap; padding: 2px 0; margin-bottom: 4px;
      background: none; border: none; font-family: var(--font); cursor: pointer;
    }
    .rack-label:hover, .rack-label:focus-visible { color: var(--text); text-decoration: underline; }

    .shelf { display: flex; gap: 8px; margin: 2px 0 2px 16px; flex-wrap: wrap; align-items: center; }
    /* Ширину 116px не трогать — по ней выравниваются ряды плиток. */
    .shelf-label {
      width: 116px; flex: none; font-size: 14px; font-weight: 700; color: rgba(24, 34, 51, 0.85);
      text-align: left; white-space: nowrap; padding: 2px 0;
      background: none; border: none; font-family: var(--font); cursor: pointer;
    }
    .shelf-label:hover, .shelf-label:focus-visible { color: var(--text); text-decoration: underline; }
    /* Заливка секции полупрозрачная, и в тёмной теме она становится тёмно-синей:
       почти чёрная подпись полки на ней не читается. Стеллажу это не нужно —
       он уже на var(--text), который сам инвертируется. */
    [data-theme="dark"] .shelf-label { color: rgba(229, 231, 235, 0.8); }

    .cell-tile {
      width: 44px; height: 30px; border-radius: var(--radius-xs); border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
      color: var(--text); cursor: default; flex: none;
    }
    .cell-free { background: var(--cell-free); color: var(--text-2); }
    .cell-occupied { background: var(--cell-occupied); color: #06301a; }
    .cell-blocked { background: var(--cell-blocked); color: #fff; }
    .cell-tile[title] { cursor: help; }
    /* Фильтр клиента (Этап 1, п.1.5): места чужого клиента приглушены, а не скрыты —
       карта остаётся цельной, видно, где лежит «не наш» товар. */
    .cell-tile--dimmed { opacity: .25; }
    .cell-tile--highlight { outline: 2px solid var(--blue); outline-offset: -2px; }

    .modal { max-height: 85vh; }
    .field-row { display: flex; gap: 8px; }
    .field-row > * { flex: 1; }
    .field-hint { font-size: 13px; color: var(--muted); margin: -4px 0 2px; }
    .dry-run-summary { font-size: 16px; color: var(--text-2); background: var(--bg2); border-radius: var(--radius-sm); padding: 10px; }
    .dry-run-summary .blocking { color: var(--red); margin-top: 6px; }
    .dry-run-summary ul { margin: 4px 0 0; padding-left: 18px; }
    .dry-run-summary details { margin-top: 6px; }
    .dry-run-summary summary { cursor: pointer; color: var(--text-2); }

    /* 0.2 — радиокнопки в модалке печати вместо select+свободный ввод. */
    .radio-group { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text-2); margin: 4px 0 8px; }
    .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; }

    /* 0.3 — «Компактно»: плитки 28×22 без строки количества, чтобы большой склад
       помещался на экран целиком. Переопределяем только то, что нужно сузить. */
    #map.compact .cell-tile { width: 28px; height: 22px; flex-direction: row; padding: 0; gap: 0; }
    #map.compact .cell-tile__no { font-size: 12px; }
    #map.compact .cell-tile__qty { display: none; }

    /* C.3 — количество товара под номером места. Плитку делаем выше и в две
       строки; существующие правила .cell-tile* выше НЕ трогаем — только
       переопределяем нужное здесь. */
    .cell-tile {
      height: 40px;
      flex-direction: column;
      line-height: 1;
      gap: 2px;
      padding: 2px 0;
    }
    .cell-tile__no { font-size: 14px; }
    .cell-tile__qty { font-size: 10px; font-weight: 700; color: var(--muted); }
    .cell-tile.cell-occupied .cell-tile__qty { color: rgba(6, 48, 26, 0.75); }
    .cell-tile.cell-blocked .cell-tile__qty { color: rgba(255, 255, 255, 0.85); }

    /* Объём плиток. Цвета статусов не трогаем — только светотень поверх них:
       блик сверху, тень снизу («толщина») и лёгкая падающая тень.
       Правило ОБЯЗАНО идти после .cell-free/.cell-occupied/.cell-blocked —
       у них background шорткатом, который сбрасывает background-image. */
    .cell-tile {
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(0, 0, 0, 0.08));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -2px 0 rgba(0, 0, 0, 0.18),
        0 1px 2px rgba(24, 34, 51, 0.25);
    }
    /* В тёмной теме --cell-free почти чёрный, и блик 0.45 выглядит подсветкой,
       а не объёмом. Селектор с атрибутом перебивает .cell-free по специфичности. */
    [data-theme="dark"] .cell-tile {
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.14));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -2px 0 rgba(0, 0, 0, 0.3),
        0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* C.3 — блоки «Содержимое» и «Последние приёмки» в модалке места. */
    .cell-contents td, .cell-receipts td { font-size: 14px; padding: 6px 10px; }
    .cell-contents th, .cell-receipts th { font-size: 12px; padding: 6px 10px; }
    .cell-contents .num, .cell-receipts .num { text-align: right; font-variant-numeric: tabular-nums; }
    .cell-empty-row { color: var(--muted); }
  </style>
</head>
<body>
  <div class="page-head">
    <h1 class="page-title">Карта склада</h1>
    <div class="toolbar">
      <div id="clientFilterMount"></div>
      <button class="btn" id="btnCompact" aria-pressed="false">Компактно</button>
      <button class="btn" id="btnPrint">🖨 Печать ШК мест</button>
      <button class="btn-accent" id="btnNewZone">+ Секция</button>
    </div>
  </div>

  <!-- 0.3 — сводная полоса: чип на каждую секцию, клик прокручивает к ней. -->
  <div id="zoneSummary" class="zone-summary"></div>

  <div id="map" class="empty-state">Загрузка…</div>

  <!-- Единое создание: секция + её структура (стеллаж → полка → место) одним действием. -->
  <div class="modal-overlay" id="newZoneModal">
    <form class="modal" id="newZoneForm">
      <h2>Новая секция</h2>
      <!-- Подписи над полями, а не плейсхолдеры: в полях половинной ширины они
           обрезались (та же жалоба, что и на печать ШК, п.1.1). -->
      <div>
        <label class="field-label" for="newZoneCode">Код секции (1–2 латинские буквы или цифры, например A или B1)</label>
        <input class="input" id="newZoneCode" maxlength="2" required />
      </div>
      <div>
        <label class="field-label" for="newZoneName">Название (необязательно)</label>
        <input class="input" id="newZoneName" />
      </div>
      <div class="field-hint">Оставьте поля ниже пустыми, чтобы создать пустую секцию.</div>
      <div>
        <label class="field-label" for="newZoneRacks">Стеллажей</label>
        <input class="input" id="newZoneRacks" type="number" min="1" />
      </div>
      <div class="field-row">
        <div>
          <label class="field-label" for="newZoneShelves">Полок на стеллаж</label>
          <input class="input" id="newZoneShelves" type="number" min="1" />
        </div>
        <div>
          <label class="field-label" for="newZoneCells">Мест на полку</label>
          <input class="input" id="newZoneCells" type="number" min="1" />
        </div>
      </div>
      <div class="field-row">
        <button type="button" class="btn" onclick="document.getElementById('newZoneModal').classList.remove('open')">Отмена</button>
        <button type="submit" class="btn btn-primary">Создать</button>
      </div>
    </form>
  </div>

  <!-- 0.1 — переделано с select+свободный ввод (никто не понимал код секции) на
       радиокнопки «что печатать» + зависимые select из уже загруженного cell-map. -->
  <div class="modal-overlay" id="printModal">
    <form class="modal" id="printForm">
      <h2>Печать ШК мест</h2>
      <div>
        <label class="field-label">Что печатать</label>
        <div class="radio-group" id="printFilterGroup">
          <label><input type="radio" name="printFilter" value="all" checked /> Все места</label>
          <label><input type="radio" name="printFilter" value="zone" /> Секция</label>
          <label><input type="radio" name="printFilter" value="rack" /> Стеллаж</label>
          <label><input type="radio" name="printFilter" value="shelf" /> Полка</label>
        </div>
      </div>
      <div id="printZoneRow" hidden>
        <label class="field-label" for="printZoneSelect">Секция</label>
        <select class="input" id="printZoneSelect"></select>
      </div>
      <div id="printRackRow" hidden>
        <label class="field-label" for="printRackSelect">Стеллаж</label>
        <select class="input" id="printRackSelect"></select>
      </div>
      <div id="printShelfRow" hidden>
        <label class="field-label" for="printShelfSelect">Полка</label>
        <select class="input" id="printShelfSelect"></select>
      </div>
      <div>
        <label class="field-label">Размер этикетки</label>
        <div class="radio-group">
          <label><input type="radio" name="printSize" value="58x40" checked /> 58×40 мм — стандартная термоэтикетка</label>
          <label><input type="radio" name="printSize" value="120x75" /> 120×75 мм — крупная, для стеллажа</label>
        </div>
      </div>
      <div class="field-hint" id="printCount">Будет напечатано: 0 этикеток</div>
      <div class="field-row">
        <button type="button" class="btn" onclick="document.getElementById('printModal').classList.remove('open')">Отмена</button>
        <button type="submit" class="btn btn-primary" id="printSubmitBtn" disabled>Скачать PDF</button>
      </div>
    </form>
  </div>

  <div class="modal-overlay" id="detailModal">
    <div class="modal" id="detailModalBody"></div>
  </div>

  <!-- Меню действий живёт вне #map: loadMap() перерисовывает #map целиком. -->
  <div class="menu" id="actionMenu" role="menu" hidden></div>

  <script src="/js/sidebar.js"></script>
  <script>
    let lastCreatedZoneCode = null;

    // Последний ответ GET /storage/cell-map — единственный источник структуры
    // склада для фронта (0.1/0.2/0.3): из него заполняются select'ы печати,
    // текущие значения в formModal и сводная полоса чипов. Обновляется в loadMap().
    let lastCellMap = null;

    function findZone(zoneId) {
      return ((lastCellMap && lastCellMap.zones) || []).find((z) => String(z.id) === String(zoneId));
    }
    function findRack(rackId) {
      for (const z of (lastCellMap && lastCellMap.zones) || []) {
        const rack = (z.racks || []).find((r) => String(r.id) === String(rackId));
        if (rack) return { zone: z, rack };
      }
      return null;
    }
    function findShelf(shelfId) {
      for (const z of (lastCellMap && lastCellMap.zones) || []) {
        for (const r of z.racks || []) {
          const shelf = (r.shelves || []).find((s) => String(s.id) === String(shelfId));
          if (shelf) return { zone: z, rack: r, shelf };
        }
      }
      return null;
    }
    function countRackCells(rack) {
      return (rack.shelves || []).reduce((sum, s) => sum + (s.cells ? s.cells.length : 0), 0);
    }
    function countZoneCells(zone) {
      return (zone.racks || []).reduce((sum, r) => sum + countRackCells(r), 0);
    }

    // Самое частое значение в массиве — предзаполнение formModal, когда полки/стеллажи
    // разного размера (0.2: «сейчас: от 3 до 5 полок», а в поле — самое частое/максимум).
    function mostFrequent(values) {
      if (!values.length) return null;
      const counts = new Map();
      let best = values[0];
      let bestCount = 0;
      values.forEach((v) => {
        const c = (counts.get(v) || 0) + 1;
        counts.set(v, c);
        if (c > bestCount) {
          bestCount = c;
          best = v;
        }
      });
      return best;
    }
    function rangeHint(label, values) {
      if (!values.length) return undefined;
      const min = Math.min(...values);
      const max = Math.max(...values);
      return min === max ? undefined : `сейчас: от ${min} до ${max} ${label}`;
    }

    // Разбирает адрес места ZONE-rack-shelf-cell (зона — 1-2 латинских буквы или цифры,
    // как ZONE_CODE_RE на бэке: 'A', 'B1', '1').
    function parseCellAddress(address) {
      const m = /^([A-Za-z0-9]{1,2})-(\d+)-(\d+)-(\d+)$/.exec(address);
      if (!m) return null;
      return { zone: m[1], rack: Number(m[2]), shelf: Number(m[3]), cell: Number(m[4]) };
    }

    function formatRanges(ranges) {
      return ranges.map(([a, b]) => (a === b ? String(a) : `${a}–${b}`)).join(', ');
    }

    // Группирует адреса по стеллажу/полке и сжимает номера мест в диапазоны —
    // вместо «полотна» из сотен адресов через запятую (0.2, жалоба 1.2).
    function compressAddresses(addresses) {
      const groups = new Map();
      addresses.forEach((addr) => {
        const parsed = parseCellAddress(addr);
        if (!parsed) return;
        const key = `${parsed.zone}-${parsed.rack}-${parsed.shelf}`;
        if (!groups.has(key)) groups.set(key, { zone: parsed.zone, rack: parsed.rack, shelf: parsed.shelf, cells: [] });
        groups.get(key).cells.push(parsed.cell);
      });
      const result = [];
      groups.forEach((g) => {
        const sorted = g.cells.slice().sort((a, b) => a - b);
        const ranges = [];
        let start = sorted[0];
        let prev = sorted[0];
        for (let i = 1; i <= sorted.length; i++) {
          const cur = sorted[i];
          if (cur === prev + 1) {
            prev = cur;
            continue;
          }
          ranges.push([start, prev]);
          start = cur;
          prev = cur;
        }
        result.push({ zone: g.zone, rack: g.rack, shelf: g.shelf, ranges });
      });
      result.sort((a, b) => a.zone.localeCompare(b.zone) || a.rack - b.rack || a.shelf - b.shelf);
      return result;
    }

    // Блокирующие места группируем так же, по стеллажу/полке, но со статусом
    // и количеством у каждого места (без сжатия в диапазоны — их обычно немного).
    function groupBlockingByShelf(blocking) {
      const groups = new Map();
      blocking.forEach((b) => {
        const parsed = parseCellAddress(b.address);
        if (!parsed) return;
        const key = `${parsed.zone}-${parsed.rack}-${parsed.shelf}`;
        if (!groups.has(key)) groups.set(key, { zone: parsed.zone, rack: parsed.rack, shelf: parsed.shelf, items: [] });
        groups.get(key).items.push({ cell: parsed.cell, status: b.status, qty: b.qty });
      });
      const result = Array.from(groups.values());
      result.forEach((g) => g.items.sort((a, b) => a.cell - b.cell));
      result.sort((a, b) => a.zone.localeCompare(b.zone) || a.rack - b.rack || a.shelf - b.shelf);
      return result;
    }

    // Статус места — на русском (идиома STATUS_LABELS из fbs/orders.html):
    // значение enum -> [подпись, класс бейджа]. API отдаёт free/occupied/blocked.
    const CELL_STATUS_LABELS = {
      free: ['свободно', 'badge-muted'],
      occupied: ['занято', 'badge-green'],
      blocked: ['заблокировано', 'badge-red'],
    };
    const cellStatusLabel = (s) => (CELL_STATUS_LABELS[s] || [s, 'badge-muted'])[0];

    // ── Меню действий ──────────────────────────────────────────────
    const actionMenu = document.getElementById('actionMenu');
    let menuAnchor = null;

    function closeMenu() {
      actionMenu.hidden = true;
      actionMenu.innerHTML = '';
      menuAnchor = null;
    }

    function openMenu(anchor, items) {
      const reopening = menuAnchor === anchor;
      closeMenu();
      if (reopening) return; // повторный клик по той же кнопке — закрыть

      items.forEach((item) => {
        if (item.sep) {
          actionMenu.appendChild(Object.assign(document.createElement('div'), { className: 'menu-sep' }));
          return;
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'menu-item' + (item.danger ? ' menu-item--danger' : '');
        btn.setAttribute('role', 'menuitem');
        btn.textContent = item.label;
        btn.addEventListener('click', () => {
          closeMenu();
          item.onClick();
        });
        actionMenu.appendChild(btn);
      });

      menuAnchor = anchor;
      actionMenu.hidden = false;

      const a = anchor.getBoundingClientRect();
      const m = actionMenu.getBoundingClientRect();
      const gap = 6;
      let top = a.bottom + gap;
      if (top + m.height > window.innerHeight - 8) top = Math.max(8, a.top - gap - m.height);
      let left = a.left;
      if (left + m.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - 8 - m.width);
      actionMenu.style.top = top + 'px';
      actionMenu.style.left = left + 'px';
      const first = actionMenu.querySelector('.menu-item');
      if (first) first.focus({ preventScroll: true });
    }

    document.addEventListener('click', (e) => {
      if (actionMenu.hidden) return;
      if (actionMenu.contains(e.target) || e.target.closest('[data-menu]')) return;
      closeMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMenu();
    });
    window.addEventListener('scroll', closeMenu, true);
    window.addEventListener('resize', closeMenu);

    // 0.3 — сводная полоса чипов: «A · 3 стеллажа · 120 мест · 45 занято», клик
    // плавно прокручивает к секции. Считается на клиенте из уже загруженной карты.
    function renderZoneSummary(zones) {
      const el = document.getElementById('zoneSummary');
      if (!zones.length) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = zones
        .map((z) => {
          const racksCount = (z.racks || []).length;
          let total = 0;
          let occupied = 0;
          (z.racks || []).forEach((r) =>
            (r.shelves || []).forEach((s) =>
              (s.cells || []).forEach((c) => {
                total++;
                if (c.status === 'occupied') occupied++;
              })
            )
          );
          return `<button type="button" class="zone-chip" data-zone-id="${z.id}">
            ${Fulfil.esc(z.code)} · ${racksCount} ${Fulfil.esc(Fulfil.plural(racksCount, 'стеллаж', 'стеллажа', 'стеллажей'))} ·
            ${total} ${Fulfil.esc(Fulfil.plural(total, 'место', 'места', 'мест'))} · ${occupied} занято
          </button>`;
        })
        .join('');
      el.querySelectorAll('.zone-chip').forEach((btn) =>
        btn.addEventListener('click', () => {
          const block = document.getElementById('zone-block-' + btn.dataset.zoneId);
          if (block) block.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        })
      );
    }

    // 0.3 — «Компактно»: плитки без строки количества, чтобы большой склад
    // помещался на экран целиком. Состояние — в localStorage (может быть недоступен).
    let compactMode = false;
    try {
      compactMode = localStorage.getItem('storageMapCompact') === '1';
    } catch (e) {
      /* приватный режим/недоступен localStorage — просто не запоминаем выбор */
    }
    function applyCompactMode() {
      const el = document.getElementById('map');
      el.classList.toggle('compact', compactMode);
      const btn = document.getElementById('btnCompact');
      btn.setAttribute('aria-pressed', String(compactMode));
      btn.classList.toggle('btn-primary', compactMode);
    }
    document.getElementById('btnCompact').addEventListener('click', () => {
      compactMode = !compactMode;
      try {
        localStorage.setItem('storageMapCompact', compactMode ? '1' : '0');
      } catch (e) {
        /* недоступен — переключатель просто не переживёт перезагрузку страницы */
      }
      applyCompactMode();
    });

    // Приглушает места, чей clientId не совпадает с выбранным в фильтре (Этап 1, п.1.5).
    // Пустые места (clientId нет) не приглушаются — они ничьи, а не «чужие».
    function applyClientFilter() {
      const selected = Fulfil.clientFilter.clientId;
      document.querySelectorAll('.cell-tile').forEach((tile) => {
        const cellClientId = tile.dataset.clientId ? Number(tile.dataset.clientId) : null;
        const dimmed = !!selected && !!cellClientId && cellClientId !== selected;
        tile.classList.toggle('cell-tile--dimmed', dimmed);
        tile.classList.toggle('cell-tile--highlight', !!selected && cellClientId === selected);
      });
    }

    async function loadMap() {
      closeMenu();
      const el = document.getElementById('map');
      try {
        const data = await Fulfil.api('GET', '/storage/cell-map');
        lastCellMap = data;
        if (!data.zones.length) {
          el.className = 'empty-state';
          el.textContent = 'Секций пока нет — создайте секцию.';
          renderZoneSummary([]);
          return;
        }
        renderZoneSummary(data.zones);
        el.className = 'map-grid';
        el.innerHTML = data.zones
          .map(
            (z) => `
          <div class="zone-block" data-zone-id="${z.id}" id="zone-block-${z.id}">
            <div class="zone-title-row">
              <div class="zone-title">Секция ${Fulfil.esc(z.code)}${z.name ? ' — ' + Fulfil.esc(z.name) : ''}</div>
              <button class="link-action" data-menu="zone" data-zone-id="${z.id}" aria-haspopup="menu">Изменить</button>
            </div>
            ${z.racks.length ? '' : '<div class="empty-state" style="padding:8px 0;">Стеллажей пока нет</div>'}
            ${z.racks
              .map(
                (r) => `
              <div class="rack">
                <button class="rack-label" data-menu="rack" data-rack-id="${r.id}"
                        aria-haspopup="menu" title="Действия со стеллажом">Стеллаж ${r.number}</button>
                ${(r.shelves || []).length ? '' : '<div class="field-hint" style="margin-left:16px;">Полок пока нет</div>'}
                ${(r.shelves || [])
                  .map(
                    (s) => `
                  <div class="shelf">
                    <button class="shelf-label" data-menu="shelf" data-shelf-id="${s.id}"
                            aria-haspopup="menu" title="Действия с полкой">Полка ${s.number}</button>
                    ${s.cells
                      .map((c) => {
                        const cls = c.status === 'blocked' ? 'cell-blocked' : c.status === 'occupied' ? 'cell-occupied' : 'cell-free';
                        const title = `${c.address} · ${cellStatusLabel(c.status)}${c.qty > 0 ? ' · ' + c.qty + ' шт' : ''}${c.blockedReason ? ' · ' + c.blockedReason : ''}`;
                        const qtyLine = c.qty > 0 ? `<span class="cell-tile__qty">${c.qty}</span>` : '';
                        return `<div class="cell-tile ${cls}" data-cell-id="${c.id}" data-client-id="${c.clientId ?? ''}" title="${Fulfil.esc(title)}"><span class="cell-tile__no">${c.cellNo}</span>${qtyLine}</div>`;
                      })
                      .join('')}
                  </div>`
                  )
                  .join('')}
              </div>`
              )
              .join('')}
          </div>`
          )
          .join('');

        el.querySelectorAll('.cell-tile').forEach((tile) =>
          tile.addEventListener('click', () => openCellDetail(tile.dataset.cellId))
        );
        applyClientFilter();
        el.querySelectorAll('[data-menu="zone"]').forEach((btn) =>
          btn.addEventListener('click', () => {
            const id = btn.dataset.zoneId;
            openMenu(btn, [
              { label: 'Переименовать', onClick: () => renameZone(id) },
              { label: 'Добавить стеллажи', onClick: () => addRacks(id) },
              { label: 'Изменить размер', onClick: () => resizeZone(id) },
              { label: 'Печать ШК', onClick: () => openPrintModal({ filter: 'zone', zoneId: id }) },
              { sep: true },
              { label: 'Удалить секцию', danger: true, onClick: () => deleteZone(id) },
            ]);
          })
        );
        el.querySelectorAll('[data-menu="rack"]').forEach((btn) =>
          btn.addEventListener('click', () => {
            const id = btn.dataset.rackId;
            const found = findRack(id);
            openMenu(btn, [
              { label: 'Изменить число полок', onClick: () => resizeRack(id) },
              {
                label: 'Печать ШК',
                onClick: () => openPrintModal({ filter: 'rack', zoneId: found ? found.zone.id : null, rackId: id }),
              },
              { sep: true },
              { label: 'Удалить стеллаж', danger: true, onClick: () => deleteRack(id) },
            ]);
          })
        );
        el.querySelectorAll('[data-menu="shelf"]').forEach((btn) =>
          btn.addEventListener('click', () => {
            const id = btn.dataset.shelfId;
            const found = findShelf(id);
            openMenu(btn, [
              { label: 'Изменить число мест', onClick: () => resizeShelf(id) },
              {
                label: 'Печать ШК',
                onClick: () =>
                  openPrintModal({
                    filter: 'shelf',
                    zoneId: found ? found.zone.id : null,
                    rackId: found ? found.rack.id : null,
                    shelfId: id,
                  }),
              },
              { sep: true },
              { label: 'Удалить полку', danger: true, onClick: () => deleteShelf(id) },
            ]);
          })
        );

        applyCompactMode();

        // Новая секция отображается последней — прокручиваем к ней.
        if (lastCreatedZoneCode) {
          const created = data.zones.find((z) => z.code === lastCreatedZoneCode);
          lastCreatedZoneCode = null;
          if (created) {
            const block = document.getElementById('zone-block-' + created.id);
            if (block) block.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
          }
        }
      } catch (err) {
        el.className = 'empty-state';
        el.textContent = Fulfil.errorText(err);
        renderZoneSummary([]);
      }
    }

    async function renameZone(zoneId) {
      const zone = findZone(zoneId);
      const values = await Fulfil.formModal({
        title: 'Переименовать секцию',
        submitLabel: 'Сохранить',
        fields: [
          { id: 'code', label: 'Код секции (латиница)', type: 'text', value: zone ? zone.code : '', required: true },
          { id: 'name', label: 'Название (необязательно)', type: 'text', value: zone ? zone.name || '' : '' },
        ],
      });
      if (!values) return;
      try {
        await Fulfil.api('PATCH', `/storage/zones/${zoneId}`, { code: values.code || undefined, name: values.name || null });

    async function addRacks(zoneId) {
      const values = await Fulfil.formModal({
        title: 'Добавить стеллажи',
        submitLabel: 'Добавить',
        fields: [
          { id: 'racks', label: 'Сколько стеллажей добавить', type: 'number', value: 1, min: 1, required: true },
          { id: 'shelvesPerRack', label: 'Полок на новый стеллаж', type: 'number', value: 1, min: 1, required: true },

    // 0.2 — сжатая сводка вместо «полотна» адресов через запятую: итог сверху,
    // ниже свёрнутый <details> с группировкой по стеллажу/полке и диапазонами мест.
    function renderDryRunSummary(plan) {
      const created = plan.toCreate || 0;
      const toDelete = plan.toDelete || [];
      const blocking = plan.blocking || [];

      let deletedDetails = '';
      if (toDelete.length) {
        const groups = compressAddresses(toDelete);
        const items = groups
          .map((g) => `<li>Стеллаж ${g.rack} · полка ${g.shelf}: места ${formatRanges(g.ranges)}</li>`)
          .join('');
        deletedDetails = `<details><summary>Какие места удаляются</summary><ul>${items}</ul></details>`;
      }

      let blockingHtml = '';
      if (blocking.length) {
        const groups = groupBlockingByShelf(blocking);
        const items = groups
          .map((g) => {
            const cellsText = g.items
              .map((it) => `${it.cell} (${Fulfil.esc(cellStatusLabel(it.status))}${it.qty ? `, ${it.qty} шт` : ''})`)
              .join(', ');
            return `<li>Стеллаж ${g.rack} · полка ${g.shelf}: места ${cellsText}</li>`;
          })
          .join('');
        blockingHtml = `<div class="blocking">Мешают ${blocking.length} ${Fulfil.esc(
          Fulfil.plural(blocking.length, 'место', 'места', 'мест')
        )}:<ul>${items}</ul></div>`;
      }

      return `
        <div class="dry-run-summary">
          Будет добавлено ${created} ${Fulfil.esc(Fulfil.plural(created, 'место', 'места', 'мест'))} ·
          будет удалено ${toDelete.length} ${Fulfil.esc(Fulfil.plural(toDelete.length, 'место', 'места', 'мест'))}
          ${deletedDetails}
          ${blockingHtml}
        </div>`;
    }

    async function resizeZone(zoneId) {
      const zone = findZone(zoneId);
      const racksCount = zone ? (zone.racks || []).length : 0;
      const shelvesCounts = zone ? (zone.racks || []).map((r) => (r.shelves || []).length) : [];
      const cellsCounts = [];
      if (zone) (zone.racks || []).forEach((r) => (r.shelves || []).forEach((s) => cellsCounts.push((s.cells || []).length)));

      let requestSeq = 0;
      const values = await Fulfil.formModal({
        title: `Изменить размер секции ${zone ? zone.code : ''}`,
        submitLabel: 'Применить',
        fields: [
          { id: 'racks', label: 'Итоговое число стеллажей', type: 'number', value: racksCount || 1, min: 1, required: true },
          {
            id: 'shelvesPerRack',
            label: 'Полок на каждый стеллаж',
            type: 'number',
            value: mostFrequent(shelvesCounts) || 1,
            min: 1,
            required: true,
            hint: rangeHint('полок', shelvesCounts),
          },
          {
            id: 'cellsPerRack',
            label: 'Мест на каждую полку',
            type: 'number',
            value: mostFrequent(cellsCounts) || 10,
            min: 1,
            required: true,
            hint: rangeHint('мест на полке', cellsCounts),
          },
        ],
        onChange: async (vals, api) => {
          if (!vals.racks || !vals.shelvesPerRack || !vals.cellsPerRack) {
            api.setPreview('');
            api.setSubmitEnabled(false);
            return;
          }
          api.setSubmitEnabled(false);
          const seq = ++requestSeq;
          try {
            const plan = await Fulfil.api('PATCH', `/storage/zones/${zoneId}?dry_run=true`, vals);
            if (seq !== requestSeq) return; // пришёл более новый запрос — этот ответ устарел
            api.setPreview(renderDryRunSummary(plan));
            api.setSubmitEnabled(!plan.blocking.length);
          } catch (err) {
            if (seq !== requestSeq) return;
            api.setPreview(`<div class="dry-run-summary"><div class="blocking">${Fulfil.esc(Fulfil.errorText(err))}</div></div>`);
            api.setSubmitEnabled(false);
          }
        },
      });
      if (!values) return;
      try {
        await Fulfil.api('PATCH', `/storage/zones/${zoneId}`, values);
        Fulfil.toast('Размер секции изменён');
        loadMap();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    }

    async function openCellDetail(cellId) {
      const overlay = document.getElementById('detailModal');
      const body = document.getElementById('detailModalBody');
      body.innerHTML = 'Загрузка…';
      overlay.classList.add('open');
      try {
        const cell = await Fulfil.api('GET', `/storage/cells/${cellId}`);
        renderCellDetail(cell);
      } catch (err) {
        body.innerHTML = `<div class="empty-state">${Fulfil.esc(Fulfil.errorText(err))}</div>`;
      }
    }

    // Дата приёмки в компактном виде DD.MM HH:MM (как в receiving.html).
    function fmtReceiptDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getDate())}.${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function renderCellDetail(cell) {
      const body = document.getElementById('detailModalBody');

      // C.3 — расклад товара по ячейке: что лежит и последние приёмки сюда.
      const contents = cell.contents || [];
      const contentsRows = contents.length
        ? contents
            .map(
              (p) => `
              <tr>
                <td>${Fulfil.esc(p.productName)}</td>
                <td class="num">${p.qty}</td>
              </tr>`
            )
            .join('')
        : '<tr><td class="cell-empty-row" colspan="2">место свободно</td></tr>';

      const receipts = cell.lastReceipts || [];
      const receiptsBlock = receipts.length
        ? `
        <div style="margin-top:12px; font-weight:600;">Последние приёмки</div>
        <table class="cell-receipts no-mobile-cards" style="margin:6px 0;">
          <tbody>
            ${receipts
              .map(
                (r) => `
              <tr>
                <td style="white-space:nowrap; color:var(--muted);">${Fulfil.esc(fmtReceiptDate(r.createdAt))}</td>
                <td>${Fulfil.esc(r.productName)}</td>
                <td class="num">${r.qty}</td>
              </tr>`
              )
              .join('')}
          </tbody>
        </table>`
        : '';

      body.innerHTML = `
        <h2>Место ${Fulfil.esc(cell.address)}</h2>
        <div>Статус: <span class="badge ${(CELL_STATUS_LABELS[cell.status] || ['', 'badge-muted'])[1]}">${Fulfil.esc(cellStatusLabel(cell.status))}</span></div>
        <div style="margin-top:12px; font-weight:600;">Содержимое</div>
        <table class="cell-contents no-mobile-cards" style="margin:6px 0;">
          <tbody>${contentsRows}</tbody>
        </table>
        ${receiptsBlock}
        <div style="margin-top:12px; font-weight:600;">Допустимые баркоды</div>
        <div id="allowedList" style="font-family:var(--mono); font-size:12px; margin:6px 0;">
          ${cell.allowedBarcodes.length ? cell.allowedBarcodes.map((b) => Fulfil.esc(b)).join(', ') : '<span style="color:var(--muted)">любой товар (допуск не настроен)</span>'}
        </div>
        <div class="field-row">
          <input class="input" id="newAllowedBarcode" placeholder="Добавить баркод" />
          <button class="btn" id="btnAddAllowed">Добавить</button>
        </div>
        <div class="field-row" style="margin-top:12px;">
          ${
            cell.status === 'blocked'
              ? `<button class="btn" id="btnUnblock">Разблокировать</button>`
              : `<button class="btn btn-danger" id="btnBlock">Заблокировать</button>`
          }
          <button class="btn btn-danger" id="btnDeleteCell">Удалить место</button>
        </div>
        <div class="field-row">
          <button class="btn" onclick="document.getElementById('detailModal').classList.remove('open')">Закрыть</button>
        </div>
      `;

      document.getElementById('btnAddAllowed').addEventListener('click', async () => {
        const barcode = document.getElementById('newAllowedBarcode').value.trim();
        if (!barcode) return;
        try {
          await Fulfil.api('POST', `/storage/cells/${cell.id}/allowed-barcodes`, { barcode });
          openCellDetail(cell.id);
        } catch (err) {
          Fulfil.toast(Fulfil.errorText(err), 'error');
        }
      });

      const blockBtn = document.getElementById('btnBlock');
      if (blockBtn) {
        blockBtn.addEventListener('click', async () => {
          const values = await Fulfil.formModal({
            title: `Заблокировать место ${cell.address}`,
            submitLabel: 'Заблокировать',
            fields: [{ id: 'reason', label: 'Причина блокировки', type: 'text', required: true }],
          });
          if (!values) return;
          try {
            await Fulfil.api('POST', `/storage/cells/${cell.id}/block`, { reason: values.reason });
            document.getElementById('detailModal').classList.remove('open');
            loadMap();
          } catch (err) {
            Fulfil.toast(Fulfil.errorText(err), 'error');
          }
        });
      }
      const unblockBtn = document.getElementById('btnUnblock');
      if (unblockBtn) {
        unblockBtn.addEventListener('click', async () => {
          try {
            await Fulfil.api('POST', `/storage/cells/${cell.id}/unblock`);
            document.getElementById('detailModal').classList.remove('open');
            loadMap();
          } catch (err) {
            Fulfil.toast(Fulfil.errorText(err), 'error');
          }
        });
      }
      document.getElementById('btnDeleteCell').addEventListener('click', async () => {
        if (!confirm(`Удалить место ${cell.address}?`)) return;
        try {
          await Fulfil.api('DELETE', `/storage/cells/${cell.id}`);
          document.getElementById('detailModal').classList.remove('open');
          Fulfil.toast('Место удалено');
          loadMap();
        } catch (err) {
          Fulfil.toast(Fulfil.errorText(err), 'error');
        }
      });
    }

    document.getElementById('btnNewZone').addEventListener('click', () => {
      document.getElementById('newZoneModal').classList.add('open');
    });
    document.getElementById('btnPrint').addEventListener('click', () => openPrintModal({ filter: 'all' }));

    document.getElementById('newZoneForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('newZoneCode').value;
      const racks = Number(document.getElementById('newZoneRacks').value) || null;
      const shelvesPerRack = Number(document.getElementById('newZoneShelves').value) || null;
      const cellsPerRack = Number(document.getElementById('newZoneCells').value) || null;
      const payload = { code, name: document.getElementById('newZoneName').value || null };
      if (racks) {
        payload.racks = racks;
        payload.shelvesPerRack = shelvesPerRack || 1;
        payload.cellsPerRack = cellsPerRack || 1;
      }
      try {
        const zone = await Fulfil.api('POST', '/storage/zones', payload);
        Fulfil.toast(
          zone.created != null ? `Секция ${zone.code} создана, мест: ${zone.created}` : `Секция ${zone.code} создана`
        );
        lastCreatedZoneCode = zone.code;
        document.getElementById('newZoneModal').classList.remove('open');
        e.target.reset();
        loadMap();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    });

    // 0.1 — модалка печати: зависимые select'ы (Секция → Стеллаж → Полка)
    // заполняются из lastCellMap, свободного ввода кода секции больше нет.

    function populatePrintZoneSelect(presetZoneId) {
      const zoneSelect = document.getElementById('printZoneSelect');
      const zones = (lastCellMap && lastCellMap.zones) || [];
      zoneSelect.innerHTML = zones
        .map((z) => `<option value="${z.id}">${Fulfil.esc(z.code)}${z.name ? ' — ' + Fulfil.esc(z.name) : ''}</option>`)
        .join('');
      if (presetZoneId != null) zoneSelect.value = presetZoneId;
    }
    function populatePrintRackSelect(presetRackId) {
      const zoneSelect = document.getElementById('printZoneSelect');
      const rackSelect = document.getElementById('printRackSelect');
      const zone = findZone(zoneSelect.value);
      const racks = (zone && zone.racks) || [];
      rackSelect.innerHTML = racks.map((r) => `<option value="${r.id}">Стеллаж ${r.number}</option>`).join('');
      if (presetRackId != null) rackSelect.value = presetRackId;
    }
    function populatePrintShelfSelect(presetShelfId) {
      const rackSelect = document.getElementById('printRackSelect');
      const shelfSelect = document.getElementById('printShelfSelect');
      const found = findRack(rackSelect.value);
      const shelves = (found && found.rack.shelves) || [];
      shelfSelect.innerHTML = shelves.map((s) => `<option value="${s.id}">Полка ${s.number}</option>`).join('');
      if (presetShelfId != null) shelfSelect.value = presetShelfId;
    }

    function updatePrintVisibility() {
      const filter = document.querySelector('input[name="printFilter"]:checked').value;
      document.getElementById('printZoneRow').hidden = filter === 'all';
      document.getElementById('printRackRow').hidden = !(filter === 'rack' || filter === 'shelf');
      document.getElementById('printShelfRow').hidden = filter !== 'shelf';
      updatePrintCount();
    }

    // Живой счётчик «Будет напечатано: N этикеток» — считается на клиенте из cell-map,
    // без похода на сервер (0.1).
    function updatePrintCount() {
      const filter = document.querySelector('input[name="printFilter"]:checked').value;
      const zones = (lastCellMap && lastCellMap.zones) || [];
      let count = 0;
      if (filter === 'all') {
        count = zones.reduce((sum, z) => sum + countZoneCells(z), 0);
      } else if (filter === 'zone') {
        const zone = findZone(document.getElementById('printZoneSelect').value);
        count = zone ? countZoneCells(zone) : 0;
      } else if (filter === 'rack') {
        const found = findRack(document.getElementById('printRackSelect').value);
        count = found ? countRackCells(found.rack) : 0;
      } else if (filter === 'shelf') {
        const found = findShelf(document.getElementById('printShelfSelect').value);
        count = found ? (found.shelf.cells || []).length : 0;
      }
      document.getElementById('printCount').textContent =
        `Будет напечатано: ${count} ${Fulfil.plural(count, 'этикетка', 'этикетки', 'этикеток')}`;
      document.getElementById('printSubmitBtn').disabled = count === 0;
    }

    function openPrintModal(preset) {
      preset = preset || {};
      const filter = preset.filter || 'all';
      document.querySelectorAll('input[name="printFilter"]').forEach((r) => {
        r.checked = r.value === filter;
      });
      populatePrintZoneSelect(preset.zoneId);
      populatePrintRackSelect(preset.rackId);
      populatePrintShelfSelect(preset.shelfId);
      updatePrintVisibility();
      document.getElementById('printModal').classList.add('open');
    }

    document.querySelectorAll('input[name="printFilter"]').forEach((r) => r.addEventListener('change', updatePrintVisibility));
    document.getElementById('printZoneSelect').addEventListener('change', () => {
      populatePrintRackSelect();
      populatePrintShelfSelect();
      updatePrintCount();
    });
    document.getElementById('printRackSelect').addEventListener('change', () => {
      populatePrintShelfSelect();
      updatePrintCount();
    });
    document.getElementById('printShelfSelect').addEventListener('change', updatePrintCount);

    document.getElementById('printForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const filter = document.querySelector('input[name="printFilter"]:checked').value;
      const size = document.querySelector('input[name="printSize"]:checked').value;
      const body = { size, filter: filter === 'shelf' ? 'rack' : filter };
      if (filter === 'zone') {
        const zone = findZone(document.getElementById('printZoneSelect').value);
        body.zoneCode = zone ? zone.code : undefined;
      } else if (filter === 'rack' || filter === 'shelf') {
        const found = findRack(document.getElementById('printRackSelect').value);
        body.zoneCode = found ? found.zone.code : undefined;
        body.rackNo = found ? found.rack.number : undefined;
        if (filter === 'shelf') {
          const shelfFound = findShelf(document.getElementById('printShelfSelect').value);
          body.shelfNo = shelfFound ? shelfFound.shelf.number : undefined;
        }
      }
      try {
        const resp = await fetch('/api/v1/storage/labels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + Fulfil.getToken() },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          // Показываем текст ошибки сервера, а не общее «Не удалось напечатать» (0.1).
          let serverError = null;
          try {
            serverError = await resp.json();
          } catch (e) {
            /* тело не JSON — оставляем serverError = null */
          }
          throw new Error(Fulfil.errorText(Object.assign({ status: resp.status }, serverError)));
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cell-labels.pdf';
        a.click();
        document.getElementById('printModal').classList.remove('open');
      } catch (err) {
        Fulfil.toast(err.message || Fulfil.errorText(err), 'error');
      }
    });

    Fulfil.clientFilter.mount(document.getElementById('clientFilterMount'), applyClientFilter).then(loadMap);
  </script>
</body>
</html>
