<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Клиенты — Fulfil</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/js/core.js"></script>
  <style>
    .field-hint { font-size: 14px; color: var(--muted); margin: -4px 0 2px; }
    /* .card из theme.css — без внутренних отступов (в отличие от .list-card),
       поэтому карточка клиента задаёт их сама. Размеры шрифтов подтянуты
       к «Товарам»: страница была заметно мельче соседних. */
    .client-card { display: flex; flex-direction: column; gap: 8px; padding: 18px; }
    .client-card + .client-card { margin-top: 10px; }
    .client-card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .client-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .client-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 16px; }
    .client-meta .meta-item { white-space: nowrap; }
    .client-meta .meta-label { color: var(--muted); }
    .client-meta .meta-value { color: var(--text-2); font-weight: 600; }
    .key-ok { color: var(--green); }
    .key-warn { color: var(--orange); }
    .key-missing { color: var(--muted); }
    .key-expired { color: var(--red); }
    .last-error { color: var(--red); font-size: 15px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal { width: 460px; max-height: 85vh; overflow: auto; }
    .field-row { display: flex; gap: 8px; align-items: center; }
    .check-result { font-size: 16px; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .archived-row { opacity: .55; }
    /* Модалка «Склад WB» (Этап 2 плана №3, п.2.2) — сложнее полей Fulfil.formModal
       (переключение существующий/новый, подгрузка списков с сервера), поэтому
       собрана вручную, как #opModal в stock.html. */
    .wh-current { font-size: 15px; color: var(--text-2); background: var(--bg2); border-radius: var(--radius-sm); padding: 10px; }
    .wh-blocked { font-size: 15px; color: var(--muted); }
    .radio-group { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--text-2); margin: 4px 0 8px; }
    .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; }
    .wh-section[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="page-head">
    <h1 class="page-title">Клиенты</h1>
    <div class="toolbar">
      <button class="btn btn-primary" id="btnNew">+ Клиент</button>
      <label class="archived-toggle">
        <input type="checkbox" id="showArchived" /> показать архивных
      </label>
      <!-- Удалённых видит только владелец (problems.txt, п.5) — чекбокс показывается по роли. -->
      <label class="archived-toggle" id="deletedToggle" hidden>
        <input type="checkbox" id="showDeleted" /> показать удалённых
      </label>
    </div>
  </div>

  <div id="body">Загрузка…</div>

  <!-- Склад WB для отгрузок клиента (Этап 2 плана №3, п.2.2): либо выбрать
       существующий склад из WB, либо создать новый прямо здесь. Свободный ввод
       ID/названия убран — раньше опечатка в нём обнаруживалась только на первой
       реальной передаче остатка. -->
  <div class="modal-overlay" id="warehouseModal">
    <div class="modal" id="warehouseModalBody"></div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script>
    let showArchived = false;
    let showDeleted = false;
    let isHost = false;

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
    }

    function keyStatusHtml(c) {
      if (!c.hasApiKey) return '<span class="key-missing">ключ не задан</span>';
      if (c.wbTokenExpired) return `<span class="key-expired">✗ ключ истёк ${fmtDate(c.wbTokenExpiresAt)}</span>`;
      if (c.wbTokenExpiringSoon) return `<span class="key-warn">⚠ действует до ${fmtDate(c.wbTokenExpiresAt)} — истекает скоро</span>`;
      if (c.wbTokenExpiresAt) return `<span class="key-ok">✓ действует до ${fmtDate(c.wbTokenExpiresAt)}</span>`;
      return '<span class="key-ok">✓ ключ задан</span>';
    }

    async function load() {
      const body = document.getElementById('body');
      try {
        const state = showDeleted ? 'all' : showArchived ? 'archived' : 'live';
        const clients = await Fulfil.api('GET', '/clients?state=' + state);
        if (!clients.length) {
          body.innerHTML = '<div class="empty-state">Клиентов пока нет — добавьте первого.</div>';
          return;
        }
        body.innerHTML = clients
          .map((c) => {
            const meta = [];
            const metaItem = (label, value, cls) =>
              meta.push(`<span class="meta-item"><span class="meta-label">${Fulfil.esc(label)}:</span> <span class="meta-value${cls ? ' ' + cls : ''}">${Fulfil.esc(value)}</span></span>`);
            // Явная причина, а не тихое тире (Этап 2, п.2.2) — без склада передача
            // остатков и синхронизация заказов для этого клиента не работают.
            metaItem(
              'Склад WB',
              c.wbWarehouseName || c.wbWarehouseId || 'не выбран — передача остатков отключена',
              c.wbWarehouseId ? '' : 'key-warn'
            );
            metaItem('SKU', String(c.skuCount));
            metaItem('Штук на складе', String(c.stockQty));
            metaItem('Активных заказов', String(c.activeOrders));
            metaItem('Последняя синхронизация', c.lastSyncAt ? fmtDate(c.lastSyncAt) : 'ещё не было');

            if (c.deletedAt) {
              metaItem('Удалён', fmtDate(c.deletedAt) + (c.deletedBy ? ' · ' + c.deletedBy : ''));
            }

            // Вернуть из архива и удалить может только владелец (problems.txt, п.5) —
            // у сотрудника на архивной карточке кнопок нет вовсе.
            const hostDelete = isHost ? `<button class="btn btn-danger" data-delete="${c.id}">Удалить</button>` : '';
            let actions;
            if (c.deletedAt) {
              actions = `<button class="btn btn-restore" data-id="${c.id}">Восстановить</button>
                 <button class="btn btn-danger" data-purge="${c.id}">Удалить безвозвратно</button>`;
            } else if (c.archivedAt) {
              actions = isHost
                ? `<button class="btn btn-restore" data-id="${c.id}">Восстановить</button>${hostDelete}`
                : '<span class="key-missing">Вернуть из архива может только владелец</span>';
            } else {
              actions = `<button class="btn btn-edit" data-id="${c.id}">Изменить</button>
                 <button class="btn" data-warehouse="${c.id}">Склад WB</button>
                 <button class="btn" data-check="${c.id}">Проверить подключение</button>
                 <button class="btn btn-danger" data-archive="${c.id}">Архивировать</button>
                 ${hostDelete}`;
            }
            const badge = c.deletedAt
              ? ' <span class="badge badge-red">удалён</span>'
              : c.archivedAt
              ? ' <span class="badge badge-muted">архив</span>'
              : '';

            return `
          <div class="card client-card ${c.archivedAt ? 'archived-row' : ''}" data-id="${c.id}">
            <div class="client-card__head">
              <div class="client-name">${Fulfil.esc(c.name)}${badge}</div>
              <div>${keyStatusHtml(c)}</div>
            </div>
            <div class="client-meta">${meta.join('')}</div>
            ${c.lastSyncError ? `<div class="last-error">Ошибка синхронизации: ${Fulfil.esc(c.lastSyncError)}</div>` : ''}
            <div class="card-actions">${actions}</div>
            <div class="check-result" id="check-${c.id}"></div>
          </div>`;
          })
          .join('');

        document.querySelectorAll('[data-check]').forEach((btn) =>
          btn.addEventListener('click', () => checkConnection(btn.dataset.check))
        );
        document.querySelectorAll('.btn-edit').forEach((btn) =>
          btn.addEventListener('click', () => openEditModal(Number(btn.dataset.id)))
        );
        document.querySelectorAll('[data-warehouse]').forEach((btn) =>
          btn.addEventListener('click', () => openWarehouseModal(clients.find((c) => c.id === Number(btn.dataset.warehouse))))
        );
        document.querySelectorAll('[data-archive]').forEach((btn) =>
          btn.addEventListener('click', () => archiveClient(btn.dataset.archive))
        );
        document.querySelectorAll('[data-delete]').forEach((btn) =>
          btn.addEventListener('click', () => deleteClient(clients.find((c) => c.id === Number(btn.dataset.delete))))
        );
        document.querySelectorAll('[data-purge]').forEach((btn) =>
          btn.addEventListener('click', () => purgeClient(clients.find((c) => c.id === Number(btn.dataset.purge))))
        );
        document.querySelectorAll('.btn-restore').forEach((btn) =>
          btn.addEventListener('click', async () => {
            try {
              await Fulfil.api('POST', `/clients/${btn.dataset.id}/restore`);
              Fulfil.toast('Клиент восстановлен');
              load();
            } catch (err) {
              Fulfil.toast(Fulfil.errorText(err), 'error');
            }
          })
        );
      } catch (err) {
        body.innerHTML = `<div class="empty-state">${Fulfil.esc(Fulfil.errorText(err))}</div>`;
      }
    }

    async function checkConnection(id) {
      const area = document.getElementById('check-' + id);
      area.innerHTML = 'Проверяем…';
      try {
        const res = await Fulfil.api('POST', `/clients/${id}/check`);
        area.innerHTML = Object.entries(res)
          .map(([host, r]) => `<span style="color:${r.ok ? 'var(--green)' : 'var(--red)'}">${Fulfil.esc(host)}: ${r.ok ? 'подключение в порядке' : Fulfil.esc(r.error || 'ошибка')}</span>`)
          .join('');
      } catch (err) {
        area.innerHTML = `<span style="color:var(--red)">${Fulfil.esc(Fulfil.errorText(err))}</span>`;
      }
    }

    async function archiveClient(id) {
      if (!confirm('Архивировать клиента? Это можно отменить в любой момент.')) return;
      try {
        await Fulfil.api('DELETE', `/clients/${id}`);
        Fulfil.toast('Клиент архивирован');
        load();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    }

    async function deleteClient(client) {
      if (!confirm(`Удалить клиента «${client.name}»? Сотрудники перестанут его видеть и не смогут вернуть. История приёмок и движений сохранится; восстановить может только владелец.`)) return;
      try {
        await Fulfil.api('POST', `/clients/${client.id}/delete`);
        Fulfil.toast('Клиент удалён');
        load();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    }

    // Необратимо — поэтому не confirm(), а ввод наименования клиента.
    async function purgeClient(client) {
      const values = await Fulfil.formModal({
        title: 'Удалить безвозвратно',
        submitLabel: 'Удалить навсегда',
        fields: [
          {
            id: 'confirmName', label: 'Введите наименование клиента', type: 'text', required: true,
            hint: `Обратной операции нет. Для подтверждения введите «${client.name}». Клиента с историей (товары, приёмки, заказы) удалить безвозвратно нельзя.`,
          },
        ],
        onChange: (v, ui) => ui.setSubmitEnabled(v.confirmName.trim() === client.name),
      });
      if (!values) return;
      try {
        await Fulfil.api('DELETE', `/clients/${client.id}/purge`);
        Fulfil.toast('Клиент удалён безвозвратно');
        load();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    }

    async function openEditModal(id) {
      let current = null;
      if (id) {
        try {
          const all = await Fulfil.api('GET', '/clients?include_archived=true');
          current = all.find((c) => c.id === id) || null;
        } catch (err) {
          Fulfil.toast(Fulfil.errorText(err), 'error');
          return;
        }
      }

      const values = await Fulfil.formModal({
        title: id ? 'Изменить клиента' : 'Новый клиент',
        submitLabel: 'Сохранить',
        fields: [
          { id: 'name', label: 'Наименование', type: 'text', value: current ? current.name : '', required: true },
          {
            id: 'apiKey', label: 'Ключ API WB', type: 'password', value: '',
            hint: id
              ? 'Оставьте пустым, чтобы не менять. Ключу нужны категории «Контент» и «Маркетплейс».'
              : 'Ключу нужны категории «Контент» и «Маркетплейс» — можно оставить пустым и ввести позже.',
          },
        ],
      });
      if (!values) return;

      // Склад WB задаётся отдельно, кнопкой «Склад WB» на карточке (Этап 2,
      // п.2.2) — выбором из списка или созданием через API, а не свободным
      // текстом здесь.
      const payload = { name: values.name };
      if (values.apiKey) payload.apiKey = values.apiKey;

      try {
        if (id) await Fulfil.api('PATCH', `/clients/${id}`, payload);
        else await Fulfil.api('POST', '/clients', payload);
        Fulfil.toast(id ? 'Клиент изменён' : 'Клиент создан');
        load();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    }

    function closeWarehouseModal() {
      document.getElementById('warehouseModal').classList.remove('open');
    }

    async function openWarehouseModal(client) {
      const overlay = document.getElementById('warehouseModal');
      const body = document.getElementById('warehouseModalBody');
      const current = client.wbWarehouseName
        ? `${client.wbWarehouseName} (${client.wbWarehouseId})`
        : client.wbWarehouseId || null;

      if (!client.hasApiKey) {
        // Без ключа WB не отдаст ни списка складов, ни списка пунктов приёма —
        // показывать пустые селекты только запутает (Этап 2, п.2.2).
        body.innerHTML = `
          <h2>Склад WB — ${Fulfil.esc(client.name)}</h2>
          <div class="wh-current">${current ? 'Сейчас: ' + Fulfil.esc(current) : 'Склад не выбран.'}</div>
          <div class="wh-blocked">Сначала укажите ключ API WB в разделе «Изменить» — без него WB не отдаёт ни список складов, ни список пунктов приёма.</div>
          <div class="field-row"><button type="button" class="btn" id="whCancel">Закрыть</button></div>`;
        overlay.classList.add('open');
        document.getElementById('whCancel').addEventListener('click', closeWarehouseModal);
        return;
      }

      body.innerHTML = `
        <h2>Склад WB — ${Fulfil.esc(client.name)}</h2>
        <div class="wh-current">${current ? 'Сейчас: ' + Fulfil.esc(current) : 'Склад не выбран — передача остатков и синхронизация заказов отключены.'}</div>
        <div class="radio-group" id="whModeGroup">
          <label><input type="radio" name="whMode" value="existing" checked /> Выбрать существующий склад</label>
          <label><input type="radio" name="whMode" value="new" /> Создать новый склад в WB</label>
        </div>
        <div class="wh-section" id="whExistingSection">
          <select class="input" id="whExistingSelect"><option value="">Загрузка…</option></select>
          <div class="field-row" style="margin-top:8px;">
            <button type="button" class="btn" id="whCancel">Отмена</button>
            <button type="button" class="btn btn-primary" id="whSelectSubmit" disabled>Выбрать</button>
          </div>
        </div>
        <div class="wh-section" id="whNewSection" hidden>
          <label class="field-label" for="whNewName">Название склада</label>
          <input class="input" id="whNewName" value="Фулфилмент ${Fulfil.esc(client.name)}" />
          <label class="field-label" for="whOfficeSelect" style="margin-top:8px;">Пункт приёма</label>
          <select class="input" id="whOfficeSelect"><option value="">Загрузка…</option></select>
          <div class="field-row" style="margin-top:8px;">
            <button type="button" class="btn" id="whCancelNew">Отмена</button>
            <button type="button" class="btn btn-primary" id="whCreateSubmit" disabled>Создать склад в WB</button>
          </div>
        </div>`;
      overlay.classList.add('open');

      const existingSection = document.getElementById('whExistingSection');
      const newSection = document.getElementById('whNewSection');
      document.querySelectorAll('input[name="whMode"]').forEach((radio) =>
        radio.addEventListener('change', () => {
          const isNew = radio.value === 'new' && radio.checked;
          if (radio.checked) {
            existingSection.hidden = isNew;
            newSection.hidden = !isNew;
          }
        })
      );
      document.getElementById('whCancel').addEventListener('click', closeWarehouseModal);
      document.getElementById('whCancelNew').addEventListener('click', closeWarehouseModal);

      // Оба списка грузятся параллельно — на «Создать» тоже переключаются сразу,
      // без повторного ожидания при смене режима.
      Fulfil.api('GET', `/clients/${client.id}/wb-warehouses`)
        .then((warehouses) => {
          const select = document.getElementById('whExistingSelect');
          if (!warehouses.length) {
            select.innerHTML = '<option value="">У этого кабинета WB нет ни одного склада</option>';
            return;
          }
          select.innerHTML = warehouses
            .map((w) => `<option value="${Fulfil.esc(w.id)}" data-name="${Fulfil.esc(w.name)}">${Fulfil.esc(w.name)} (${Fulfil.esc(w.id)})</option>`)
            .join('');
          document.getElementById('whSelectSubmit').disabled = false;
        })
        .catch((err) => {
          document.getElementById('whExistingSelect').innerHTML = `<option value="">${Fulfil.esc(Fulfil.errorText(err))}</option>`;
        });

      Fulfil.api('GET', `/clients/${client.id}/wb-offices`)
        .then((offices) => {
          const select = document.getElementById('whOfficeSelect');
          if (!offices.length) {
            select.innerHTML = '<option value="">У кабинета WB нет пунктов приёма</option>';
            return;
          }
          select.innerHTML = offices
            .map((o) => `<option value="${o.id}">${Fulfil.esc(o.name)}${o.address ? ' — ' + Fulfil.esc(o.address) : ''}</option>`)
            .join('');
          document.getElementById('whCreateSubmit').disabled = false;
        })
        .catch((err) => {
          document.getElementById('whOfficeSelect').innerHTML = `<option value="">${Fulfil.esc(Fulfil.errorText(err))}</option>`;
        });

      document.getElementById('whSelectSubmit').addEventListener('click', async () => {
        const select = document.getElementById('whExistingSelect');
        const option = select.options[select.selectedIndex];
        if (!option || !option.value) return;
        try {
          await Fulfil.api('POST', `/clients/${client.id}/wb-warehouses/select`, {
            warehouseId: option.value,
            warehouseName: option.dataset.name || option.value,
          });
          Fulfil.toast('Склад привязан');
          closeWarehouseModal();
          load();
        } catch (err) {
          Fulfil.toast(Fulfil.errorText(err), 'error');
        }
      });

      document.getElementById('whCreateSubmit').addEventListener('click', async () => {
        const name = document.getElementById('whNewName').value.trim();
        const officeId = document.getElementById('whOfficeSelect').value;
        if (!name || !officeId) {
          Fulfil.toast('Укажите название склада и пункт приёма', 'error');
          return;
        }
        try {
          await Fulfil.api('POST', `/clients/${client.id}/wb-warehouses`, { name, officeId: Number(officeId) });
          Fulfil.toast('Склад создан и привязан');
          closeWarehouseModal();
          load();
        } catch (err) {
          Fulfil.toast(Fulfil.errorText(err), 'error');
        }
      });
    }

    document.getElementById('btnNew').addEventListener('click', () => openEditModal(null));
    document.getElementById('showArchived').addEventListener('change', (e) => {
      showArchived = e.target.checked;
      load();
    });
    document.getElementById('showDeleted').addEventListener('change', (e) => {
      showDeleted = e.target.checked;
      load();
    });

    (typeof Fulfil.me === 'function' ? Fulfil.me() : Promise.reject(null))
      .then((user) => {
        isHost = user.role === 'host';
        document.getElementById('deletedToggle').hidden = !isHost;
      })
      .catch(() => {})
      .finally(load);
  </script>
</body>
</html>
