<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Товары — Fulfil</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/js/core.js"></script>
  <style>
    /* .toolbar и .archived-toggle — общие, вынесены в theme.css. */
    .search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .search-row .search-field { flex: 1 1 320px; }
    /* 3.1 — фильтры каталога отдельной строкой под поиском: четыре независимых
       списка в порядке товар → размер → цвет → бренд. Ширина как в stock.html:
       не растягиваться на всю строку, но и не сжиматься до нечитаемого. */
    .filters-row { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .filters-row .input { width: auto; flex: 0 1 210px; min-width: 150px; }
    .filters-row .btn { flex: none; }
    .manual-mark { font-size: 12px; color: var(--orange); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 4px; }
    .archived-row { opacity: .55; }
    .product-name { font-size: 18px; font-weight: 600; line-height: 1.2; color: var(--text); }
    .product-meta .mono { font-family: var(--mono); }
    /* 0.4 — мета-строка карточки: пары «название: значение» вместо голых значений
       через точку (заказчик не понимал, что есть что). flex-wrap, чтобы на мобильном
       переносилось, а не резалось. */
    .product-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .product-meta .meta-item { white-space: nowrap; }
    .product-meta .meta-label { color: var(--muted); }
    .product-meta .meta-value { color: var(--text-2); font-weight: 600; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal { width: 420px; max-height: 85vh; }
    .field-row { display: flex; gap: 8px; align-items: center; }
    .field-row > input, .field-row > select { flex: 1; }
    /* .field-label — общий, вынесен в theme.css (0.2: понадобился и Fulfil.formModal). */
    .revert-link { cursor: pointer; color: var(--blue); font-size: 13px; }
    /* Карточка товара со строкой-миниатюрой (не трогаем общий .list-card). */
    .list-card--with-thumb { flex-direction: row; align-items: center; gap: 14px; }
    .list-card--with-thumb .product-thumb {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      object-fit: cover;
      border-radius: var(--radius-xs);
      background: var(--bg2);
    }
    .list-card--with-thumb .product-thumb--empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }
    .list-card--with-thumb .product-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .edit-photo { text-align: center; margin-bottom: 12px; }
    .edit-photo img {
      max-width: 240px;
      max-height: 240px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    /* Пагинация каталога — размеры/цвета подтянуты к .archived-toggle и .btn,
       чтобы панель не выделялась среди остальных элементов страницы. */
    .pagination-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .pagination-bar[hidden] { display: none; }
    .page-size-group { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--text-2); white-space: nowrap; }
    .page-size-group select.input { width: auto; }
    .pagination-controls { display: flex; align-items: center; gap: 10px; }
    .pagination-controls .page-info { font-size: 16px; color: var(--text-2); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="page-head">
    <h1 class="page-title">Товары</h1>
    <div class="toolbar">
      <button class="btn" id="btnNewProduct">+ Товар</button>
      <button class="btn btn-primary" id="btnSync">Синхронизировать с WB</button>
    </div>
  </div>

  <div class="search-row">
    <div id="clientFilterMount"></div>
    <div class="search-field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
      </svg>
      <input class="input" id="search" placeholder="Поиск по товару, артикулу или штрихкоду" />
    </div>
    <label class="archived-toggle">
      <input type="checkbox" id="showArchived" /> показать архивные
    </label>
  </div>

  <!-- Подпись поля вшита в первый пункт («Товар: все»), чтобы не заводить
       отдельные лейблы и не удваивать высоту строки. -->
  <div class="filters-row">
    <select class="input" id="filterName"><option value="">Товар: все</option></select>
    <select class="input" id="filterSize"><option value="">Размер: все</option></select>
    <select class="input" id="filterColor"><option value="">Цвет: все</option></select>
    <select class="input" id="filterBrand"><option value="">Бренд: все</option></select>
    <button class="btn" id="btnResetFilters" hidden>Сбросить фильтры</button>
  </div>

  <div id="body">Загрузка…</div>

  <div class="pagination-bar" id="paginationBar" hidden>
    <label class="page-size-group">
      Показывать по:
      <select class="input" id="pageSize">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </label>
    <div class="pagination-controls">
      <button class="btn" id="btnPrevPage">← Назад</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="btn" id="btnNextPage">Вперёд →</button>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal" id="editModalBody"></div>
  </div>

  <div class="modal-overlay" id="newModal">
    <form class="modal" id="newForm">
      <h2>Новый товар</h2>
      <div class="field-row"><select class="input" id="newClientId" required></select></div>
      <div class="field-row"><input class="input" id="newBarcode" placeholder="Баркод (GTIN или LDX-XXXXXX)" required /></div>
      <div class="field-row"><input class="input" id="newName" placeholder="Название" required /></div>
      <div class="field-row"><input class="input" id="newBrand" placeholder="Бренд" /></div>
      <div class="field-row">
        <input class="input" id="newSize" placeholder="Размер" />
        <input class="input" id="newColor" placeholder="Цвет" />
      </div>
      <div class="field-row">
        <button type="button" class="btn" onclick="document.getElementById('newModal').classList.remove('open')">Отмена</button>
        <button type="submit" class="btn btn-primary">Создать</button>
      </div>
    </form>
  </div>

  <script src="/js/sidebar.js"></script>
  <script>
    let currentSearch = '';
    let showArchived = false;

    // Пагинация — как и фильтры, целиком на клиенте: сервер сейчас отдаёт
    // весь отфильтрованный список за раз, разбивка на страницы только рисует
    // нужный кусок allItems. Смена фильтра/поиска/страницы сбрасывает currentPage.
    let allItems = [];
    let currentPage = 1;
    let pageSize = 20;

    // 3.1 — фильтры каталога. Порядок массива = порядок списков в интерфейсе;
    // поле совпадает с именем query-параметра и ключом в /products/filter-options.
    const FILTERS = [
      { field: 'name', el: 'filterName', label: 'Товар' },
      { field: 'size', el: 'filterSize', label: 'Размер' },
      { field: 'color', el: 'filterColor', label: 'Цвет' },
      { field: 'brand', el: 'filterBrand', label: 'Бренд' },
    ];
    const filters = { name: '', size: '', color: '', brand: '' };

    // Списки независимы: значения берутся по всему каталогу клиента и не сужаются
    // соседними фильтрами. Выбранное значение сохраняется, если оно ещё есть
    // в новом наборе (сменили клиента — «его» бренда может уже не быть).
    async function loadFilterOptions() {
      const q = new URLSearchParams();
      if (showArchived) q.set('include_archived', 'true');
      if (Fulfil.clientFilter.clientId) q.set('client_id', String(Fulfil.clientFilter.clientId));
      let options;
      try {
        options = await Fulfil.api('GET', '/products/filter-options?' + q.toString());
      } catch (err) {
        // Списки не загрузились — фильтры остаются пустыми, каталог виден целиком.
        return;
      }
      FILTERS.forEach((f) => {
        const select = document.getElementById(f.el);
        const values = options[f.field] || [];
        if (!values.includes(filters[f.field])) filters[f.field] = '';
        select.innerHTML =
          `<option value="">${Fulfil.esc(f.label)}: все</option>` +
          values.map((v) => `<option value="${Fulfil.esc(v)}">${Fulfil.esc(v)}</option>`).join('');
        select.value = filters[f.field];
      });
      syncResetButton();
    }

    function syncResetButton() {
      document.getElementById('btnResetFilters').hidden = !FILTERS.some((f) => filters[f.field]);
    }

    /** Перезагрузка и списков значений, и каталога. Нужна там, где меняется сам
     *  набор значений (правка/создание товара, синк с WB, архивация), а не только
     *  выдача — иначе в фильтре останется бренд, которого уже нет. */
    function reloadAll() {
      return loadFilterOptions().then(load);
    }

    async function load() {
      const body = document.getElementById('body');
      try {
        const q = new URLSearchParams();
        if (currentSearch) q.set('search', currentSearch);
        if (showArchived) q.set('include_archived', 'true');
        if (Fulfil.clientFilter.clientId) q.set('client_id', String(Fulfil.clientFilter.clientId));
        FILTERS.forEach((f) => {
          if (filters[f.field]) q.set(f.field, filters[f.field]);
        });
        allItems = await Fulfil.api('GET', '/products?' + q.toString());
        currentPage = 1;
        renderPage();
      } catch (err) {
        document.getElementById('paginationBar').hidden = true;
        body.innerHTML = `<div class="empty-state">${Fulfil.esc(Fulfil.errorText(err))}</div>`;
      }
    }

    function renderPage() {
      const body = document.getElementById('body');
      const paginationBar = document.getElementById('paginationBar');
      if (!allItems.length) {
        paginationBar.hidden = true;
        // С активным фильтром «Товаров пока нет» вводит в заблуждение: каталог
        // не пуст, просто под условия ничего не подошло.
        const narrowed = currentSearch || FILTERS.some((f) => filters[f.field]);
        body.innerHTML = narrowed
          ? '<div class="empty-state">Под выбранные условия ничего не подошло</div>'
          : '<div class="empty-state">Товаров пока нет</div>';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(allItems.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * pageSize;
      const items = allItems.slice(start, start + pageSize);

      body.innerHTML = items
        .map((p) => {
          const manual = new Set(p.manualFields || []);
          const mark = (field) => (manual.has(field) ? '<span class="manual-mark" title="Изменено вручную">✎</span>' : '');

          // Колонки таблицы сложены в одну мета-строку карточки (макет /goods).
          // 0.4: раньше значения шли голым списком через « · » без подписи поля —
          // заказчик не понимал, что есть что. Теперь пары «название: значение»;
          // поле показывается, если есть значение или пометка ручной правки.
          const meta = [];
          const metaField = (label, value, ...marks) => {
            const m = marks.map(mark).join('');
            const v = Fulfil.esc(value || '');
            if (!v && !m) return;
            meta.push(
              `<span class="meta-item"><span class="meta-label">${Fulfil.esc(label)}:</span> <span class="meta-value">${v || '—'}</span>${m}</span>`
            );
          };
          // ШК — особый случай, сохраняем прежнее поведение «ШК не задан» для
          // пустого/временного (TEMP-) баркода вместо тире.
          meta.push(
            p.barcode && !p.barcode.startsWith('TEMP')
              ? `<span class="meta-item"><span class="meta-label">ШК:</span> <span class="meta-value mono">${Fulfil.esc(p.barcode)}</span>${mark('barcode')}</span>`
              : `<span class="meta-item"><span class="meta-label">ШК:</span> <i>не задан</i>${mark('barcode')}</span>`
          );
          metaField('Клиент', p.clientName);
          metaField('Артикул', p.vendorCode, 'vendor_code');
          metaField('Бренд', p.brand, 'brand');
          metaField('Размер', p.size, 'size');
          metaField('Цвет', p.color, 'color');
          metaField('nmID WB', p.wbNmId);

          const actions = p.archivedAt
            ? `<button class="btn btn-restore" data-id="${p.id}">Восстановить</button>`
            : `<button class="btn btn-edit" data-id="${p.id}">Изменить</button>
               <button class="btn btn-danger btn-delete" data-id="${p.id}">Удалить</button>
               ${p.wbNmId ? '' : `<button class="btn btn-gen" data-id="${p.id}">Внутренний ШК</button>`}`;

          // Миниатюра: /images/tm/ вместо /images/big/. onerror откатывает на
          // исходный imageUrl (data-full) и снимает сам себя, чтобы не зациклиться.
          const thumbHtml = p.imageUrl
            ? `<img class="product-thumb" src="${Fulfil.esc(Fulfil.thumb(p.imageUrl))}" alt=""
                    loading="lazy" data-full="${Fulfil.esc(p.imageUrl)}"
                    onerror="this.onerror=null;this.src=this.dataset.full;" />`
            : `<div class="product-thumb product-thumb--empty" aria-hidden="true">—</div>`;

          return `
        <div class="list-card list-card--with-thumb ${p.archivedAt ? 'archived-row' : ''}" data-id="${p.id}">
          ${thumbHtml}
          <div class="product-content">
            <div class="product-name">${Fulfil.esc(p.name)}${mark('name')}${p.archivedAt ? ' <span class="badge badge-muted">архив</span>' : ''}</div>
            <div class="list-card__meta product-meta">${meta.join('')}</div>
            <div class="card-actions">${actions}</div>
          </div>
        </div>`;
        })
        .join('');

      document.querySelectorAll('.btn-gen').forEach((btn) =>
        btn.addEventListener('click', async () => {
          try {
            await Fulfil.api('POST', `/products/${btn.dataset.id}/generate-internal-barcode`);
            load();
          } catch (err) {
            Fulfil.toast(Fulfil.errorText(err), 'error');
          }
        })
      );
      document.querySelectorAll('.btn-edit').forEach((btn) =>
        btn.addEventListener('click', () => openEditModal(btn.dataset.id))
      );
      document.querySelectorAll('.btn-delete').forEach((btn) =>
        btn.addEventListener('click', () => deleteProduct(btn.dataset.id))
      );
      document.querySelectorAll('.btn-restore').forEach((btn) =>
        btn.addEventListener('click', async () => {
          try {
            await Fulfil.api('POST', `/products/${btn.dataset.id}/restore`);
            Fulfil.toast('Товар восстановлен');
            reloadAll();
          } catch (err) {
            Fulfil.toast(Fulfil.errorText(err), 'error');
          }
        })
      );

      paginationBar.hidden = false;
      document.getElementById('pageInfo').textContent =
        `${start + 1}–${Math.min(start + pageSize, allItems.length)} из ${allItems.length} (стр. ${currentPage} из ${totalPages})`;
      document.getElementById('btnPrevPage').disabled = currentPage <= 1;
      document.getElementById('btnNextPage').disabled = currentPage >= totalPages;
    }

    document.getElementById('pageSize').addEventListener('change', (e) => {
      pageSize = Number(e.target.value);
      currentPage = 1;
      renderPage();
    });
    document.getElementById('btnPrevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    });
    document.getElementById('btnNextPage').addEventListener('click', () => {
      const totalPages = Math.max(1, Math.ceil(allItems.length / pageSize));
      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    });

    async function deleteProduct(id) {
      if (!confirm('Удалить товар?')) return;
      try {
        const res = await Fulfil.api('DELETE', `/products/${id}`);
        Fulfil.toast(res.outcome === 'archived' ? 'Товар архивирован (есть история)' : 'Товар удалён');
        reloadAll();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    }

    function fieldRow(label, id, value, fieldName, manual) {
      const isManual = manual.has(fieldName);
      return `
        <div>
          <div class="field-label">
            <span>${label}</span>
            ${isManual ? `<span class="revert-link" data-revert="${fieldName}">вернуть значение WB</span>` : ''}
          </div>
          <input class="input" id="${id}" value="${Fulfil.esc(value || '')}" />
        </div>`;
    }

    async function openEditModal(id) {
      const overlay = document.getElementById('editModal');
      const body = document.getElementById('editModalBody');
      body.innerHTML = 'Загрузка…';
      overlay.classList.add('open');
      try {
        const p = await Fulfil.api('GET', `/products/${id}`);
        const manual = new Set(p.manualFields || []);
        body.innerHTML = `
          <h2>Изменить товар</h2>
          ${p.imageUrl ? `<div class="edit-photo"><img src="${Fulfil.esc(p.imageUrl)}" alt="Фото товара" loading="lazy" /></div>` : ''}
          <div><div class="field-label"><span>Клиент</span></div><div class="meta-value">${Fulfil.esc(p.clientName || '')}</div></div>
          ${fieldRow('Название', 'editName', p.name, 'name', manual)}
          ${fieldRow('Бренд', 'editBrand', p.brand, 'brand', manual)}
          ${fieldRow('Размер', 'editSize', p.size, 'size', manual)}
          ${fieldRow('Цвет', 'editColor', p.color, 'color', manual)}
          ${fieldRow('Артикул', 'editVendorCode', p.vendorCode, 'vendor_code', manual)}
          <div>
            <div class="field-label">
              <span>Баркод ${p.wbNmId ? '(нельзя менять — товар из WB)' : ''}</span>
              ${manual.has('barcode') ? `<span class="revert-link" data-revert="barcode">вернуть значение WB</span>` : ''}
            </div>
            <input class="input" id="editBarcode" value="${Fulfil.esc(p.barcode)}" ${p.wbNmId ? 'disabled' : ''} />
          </div>
          <div class="field-row" style="margin-top:8px;">
            <button type="button" class="btn" id="editCancel">Отмена</button>
            <button type="button" class="btn btn-primary" id="editSave">Сохранить</button>
          </div>`;

        document.getElementById('editCancel').addEventListener('click', () => overlay.classList.remove('open'));
        document.querySelectorAll('[data-revert]').forEach((el) =>
          el.addEventListener('click', async () => {
            try {
              await Fulfil.api('POST', `/products/${id}/revert-manual-field`, { field: el.dataset.revert });
              Fulfil.toast('Значение будет восстановлено ближайшей синхронизацией с WB');
              openEditModal(id);
            } catch (err) {
              Fulfil.toast(Fulfil.errorText(err), 'error');
            }
          })
        );
        document.getElementById('editSave').addEventListener('click', async () => {
          const patch = {
            name: document.getElementById('editName').value,
            brand: document.getElementById('editBrand').value,
            size: document.getElementById('editSize').value,
            color: document.getElementById('editColor').value,
            vendorCode: document.getElementById('editVendorCode').value,
          };
          if (!p.wbNmId) patch.barcode = document.getElementById('editBarcode').value;
          try {
            await Fulfil.api('PATCH', `/products/${id}`, patch);
            Fulfil.toast('Товар изменён');
            overlay.classList.remove('open');
            reloadAll();
          } catch (err) {
            Fulfil.toast(Fulfil.errorText(err), 'error');
          }
        });
      } catch (err) {
        body.innerHTML = `<div class="empty-state">${Fulfil.esc(Fulfil.errorText(err))}</div>`;
      }
    }

    document.getElementById('btnSync').addEventListener('click', async () => {
      try {
        const clientId = Fulfil.clientFilter.clientId;
        const res = await Fulfil.api(
          'POST', '/products/sync-from-wb' + (clientId ? `?client_id=${clientId}` : '')
        );
        // По каждому клиенту — своя строка тоста (Этап 1, п.1.5): ошибка одного
        // клиента не мешает увидеть результат остальных.
        if (!res.results.length) {
          Fulfil.toast('Нет клиентов с заданным ключом API для синхронизации', 'error');
        } else {
          res.results.forEach((r) => {
            const msg = r.error
              ? `${r.clientName}: ошибка — ${r.error}`
              : `${r.clientName}: синхронизировано ${r.imported}`;
            Fulfil.toast(msg, r.error ? 'error' : 'success');
          });
        }
        reloadAll();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    });

    async function fillNewProductClientSelect() {
      const select = document.getElementById('newClientId');
      select.innerHTML = '<option value="">Загрузка…</option>';
      try {
        const clients = await Fulfil.api('GET', '/clients');
        select.innerHTML = clients.map((c) => `<option value="${c.id}">${Fulfil.esc(c.name)}</option>`).join('');
        if (Fulfil.clientFilter.clientId) select.value = String(Fulfil.clientFilter.clientId);
      } catch (err) {
        select.innerHTML = '<option value="">Не удалось загрузить клиентов</option>';
      }
    }

    document.getElementById('btnNewProduct').addEventListener('click', () => {
      fillNewProductClientSelect();
      document.getElementById('newModal').classList.add('open');
    });
    document.getElementById('newForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const clientId = Number(document.getElementById('newClientId').value);
      if (!clientId) {
        Fulfil.toast('Выберите клиента', 'error');
        return;
      }
      try {
        await Fulfil.api('POST', '/products', {
          clientId,
          barcode: document.getElementById('newBarcode').value,
          name: document.getElementById('newName').value,
          brand: document.getElementById('newBrand').value || null,
          size: document.getElementById('newSize').value || null,
          color: document.getElementById('newColor').value || null,
        });
        Fulfil.toast('Товар создан');
        document.getElementById('newModal').classList.remove('open');
        e.target.reset();
        reloadAll();
      } catch (err) {
        Fulfil.toast(Fulfil.errorText(err), 'error');
      }
    });

    document.getElementById('showArchived').addEventListener('change', (e) => {
      showArchived = e.target.checked;
      // Архивные меняют и набор значений в фильтрах, не только выдачу.
      loadFilterOptions().then(load);
    });

    FILTERS.forEach((f) => {
      document.getElementById(f.el).addEventListener('change', (e) => {
        filters[f.field] = e.target.value;
        syncResetButton();
        load();
      });
    });

    document.getElementById('btnResetFilters').addEventListener('click', () => {
      FILTERS.forEach((f) => {
        filters[f.field] = '';
        document.getElementById(f.el).value = '';
      });
      syncResetButton();
      load();
    });

    let searchTimer;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      currentSearch = e.target.value;
      searchTimer = setTimeout(load, 250);
    });

    // Смена клиента меняет и каталог, и набор значений в фильтрах.
    Fulfil.clientFilter.mount(document.getElementById('clientFilterMount'), reloadAll).then(reloadAll);
  </script>
</body>
</html>
